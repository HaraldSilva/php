name: Smart Build Multi-Version PHP Images

on:
  push:
    branches: [ "main" ]
  schedule:
    # Check every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  DOCKERHUB_REPO: haraldsilva/php
  GHCR_REPO: ghcr.io/haraldsilva/php

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        php_version: [ '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream updates from serversideup/php
        id: check_update
        env:
          UPSTREAM_IMAGE: serversideup/php:${{ matrix.php_version }}-fpm
          CUSTOM_IMAGE: ${{ env.DOCKERHUB_REPO }}:${{ matrix.php_version }}-fpm
        run: |
          UPSTREAM_DIGEST=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "Upstream Digest ($UPSTREAM_IMAGE): $UPSTREAM_DIGEST"
          echo "upstream_digest=$UPSTREAM_DIGEST" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Triggered by '${{ github.event_name }}' -> Enforcing rebuild."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_BASE_DIGEST=$(docker buildx imagetools inspect "$CUSTOM_IMAGE" --format '{{index .Image.Config.Labels "org.opencontainers.image.base.digest"}}' 2>/dev/null || echo "none")
          echo "Last built digest ($CUSTOM_IMAGE): $LAST_BASE_DIGEST"

          if [ "$UPSTREAM_DIGEST" != "$LAST_BASE_DIGEST" ]; then
            echo "New upstream update detected! Triggering build..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "No update found. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_update.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Dual-Registry PHP ${{ matrix.php_version }}
        if: steps.check_update.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          labels: |
            org.opencontainers.image.base.name=serversideup/php:${{ matrix.php_version }}-fpm
            org.opencontainers.image.base.digest=${{ steps.check_update.outputs.upstream_digest }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ matrix.php_version }}-fpm
            ${{ env.GHCR_REPO }}:${{ matrix.php_version }}-fpm

      - name: Send Pushover Alert
        if: steps.check_update.outputs.should_build == 'true'
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          CUSTOM_IMAGE: ${{ env.DOCKERHUB_REPO }}:${{ matrix.php_version }}-fpm
        run: |
          if [ -n "$PUSHOVER_USER" ] && [ -n "$PUSHOVER_TOKEN" ]; then
            EXACT_VER=$(docker buildx imagetools inspect "$CUSTOM_IMAGE" --format '{{index .Image.Config.Labels "org.opencontainers.image.version"}}' 2>/dev/null || echo "${{ matrix.php_version }}")

            curl -s \
              --form-string "token=${PUSHOVER_TOKEN}" \
              --form-string "user=${PUSHOVER_USER}" \
              --form-string "title=🐘 PHP ${{ matrix.php_version }} Dual-Push Completed" \
              --form-string "html=1" \
              --form-string "message=PHP ${{ matrix.php_version }} has been rebuilt from a new <b>serversideup/php</b> release and pushed to both registries.<br><br><b>Docker Hub:</b> <code>${{ env.DOCKERHUB_REPO }}:${{ matrix.php_version }}-fpm</code><br><b>GHCR:</b> <code>${{ env.GHCR_REPO }}:${{ matrix.php_version }}-fpm</code><br><b>Base Version:</b> <code>${EXACT_VER}</code><br><b>Trigger:</b> ${{ github.event_name }}" \
              --form-string "url=https://hub.docker.com/r/${{ env.DOCKERHUB_REPO }}/tags" \
              --form-string "url_title=View on Docker Hub" \
              https://api.pushover.net/1/messages.json
          fi
